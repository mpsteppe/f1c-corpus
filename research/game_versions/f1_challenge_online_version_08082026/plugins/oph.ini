# Those settings is part of oph.dll what made by Evilclip
# bool settings is possible modifi by true or false

[PCSettings]


[Telemetry]

# enables telemetry support in UDP port
enabled = false

# Port for UDP telemetry, default is 20777
port = 20777

# Address for telemetry, default local address for UDP is 255.255.255.255
address = 255.255.255.255


[HostSettings]

# disables for host the exe mismatch
exemismatch = false


[GameSettings]

# makes player for AI mode in multiplayer
noPlayer = false

# this lowers mutex protection in game what allows run more than one game at same time.
Mutex = false

# Enables for use the mouse as steering wheel
enableMouseSteering = false

# Disables Rain effects what is build inside oph
disableCustomRain = true

# Disables Helmet view what is build inside oph, that also disables the oph rain even if it's enabled
disableHelmetView = true

# Custom mirror quality, 0 = off, 1 = low, 2 = medium 3 = high 
Mirror = 0

#Limits FPS in menu or specator view to 30 as default
FPS_Menu = 90

#Limits FPS in gameplay to 90 as default
FPS_Gameplay = 90
